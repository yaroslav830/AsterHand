# Reference workflow for the former standalone iOS Pages site.
# Merge the generated APT files into the website Pages artifact under ios-apt/ before enabling deployment.
name: Update signed iOS software source

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published, edited, released]
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-apt.yml'
      - 'apt-repo/**'
      - 'scripts/*ios_apt*.py'
      - 'tests/test_ios_apt_common.py'

permissions:
  contents: read

concurrency:
  group: asterhand-ios-apt
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'yaroslav830/AsterHand'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Test version and dependency selection
        run: python -m unittest discover -s tests -p test_ios_apt_common.py
      - name: Check existing published version
        run: curl --fail --silent --show-error --retry 2 https://yaroslav830.github.io/AsterHand/ios-apt/repository.json -o previous-repository.json
      - name: Download latest stable release and native OpenSSH dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_ios_apt_upstreams.py --output build/apt-artifacts --previous-manifest previous-repository.json
      - name: Import the existing APT signing key
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/asterhand-apt-signing
        shell: bash
        run: |
          test -n "$APT_SIGNING_PRIVATE_KEY" || { echo 'Missing repository secret APT_SIGNING_PRIVATE_KEY'; exit 1; }
          install -m 700 -d "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys 457D056969DE0D9DB31C0259025BDCAD4FDCD88C >/dev/null
      - name: Preserve third-party notices and source material
        run: python scripts/collect_ios_apt_notices.py build/apt-artifacts
      - name: Build and verify all four signed sources
        env:
          GNUPGHOME: ${{ runner.temp }}/asterhand-apt-signing
        run: |
          python scripts/build_ios_apt_repo.py --artifacts build/apt-artifacts --dependencies build/apt-artifacts/dependencies.json --output build/ios-apt-site --gpg-home "$GNUPGHOME" --key 457D056969DE0D9DB31C0259025BDCAD4FDCD88C
          python scripts/check_ios_apt_repo.py build/ios-apt-site
      - name: Remove the temporary signing key
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/asterhand-apt-signing
        shell: bash
        run: |
          gpgconf --kill gpg-agent || true
          if [[ "$GNUPGHOME" == "$RUNNER_TEMP/asterhand-apt-signing" ]]; then rm -rf -- "$GNUPGHOME"; fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/ios-apt-site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified source
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
