name: Deploy AsterHand official website

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/images/**'
      - 'apt-repo/**'
      - 'Resources/Icons/AppIcon60x60@3x.png'
      - 'scripts/build_asterhand_website.py'
      - 'scripts/*ios_apt*.py'
      - 'scripts/collect_ios_apt_notices.py'
      - 'tests/test_ios_apt_common.py'
      - '.github/workflows/website.yml'

permissions:
  contents: read

concurrency:
  group: asterhand-website-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'yaroslav830/AsterHand' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Build the public website
        run: python scripts/build_asterhand_website.py --output build/website

      - name: Test APT version and dependency selection
        run: python -m unittest discover -s tests -p test_ios_apt_common.py

      - name: Download and verify iOS packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          previous_manifest="$RUNNER_TEMP/asterhand-previous-repository.json"
          status="$(curl --silent --show-error --retry 2 --max-time 30 \
            --output "$previous_manifest" --write-out '%{http_code}' \
            https://yaroslav830.github.io/AsterHand/ios-apt/repository.json)"
          sync_args=(--output build/apt-artifacts)
          case "$status" in
            200)
              sync_args+=(--previous-manifest "$previous_manifest")
              ;;
            404)
              echo 'No published APT manifest found. Building the initial index.'
              ;;
            *)
              echo "::error::Could not read the existing APT manifest (HTTP $status)."
              exit 1
              ;;
          esac
          python scripts/sync_ios_apt_upstreams.py "${sync_args[@]}"

      - name: Collect third-party notices
        run: python scripts/collect_ios_apt_notices.py build/apt-artifacts

      - name: Build and sign iOS software source
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$APT_SIGNING_PRIVATE_KEY" ]]; then
            echo '::error::Missing repository secret APT_SIGNING_PRIVATE_KEY.'
            exit 1
          fi
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/asterhand-apt-signing.XXXXXX")"
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf -- "$GNUPGHOME"' EXIT
          printf '%s\n' "$APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          unset APT_SIGNING_PRIVATE_KEY
          fingerprint='457D056969DE0D9DB31C0259025BDCAD4FDCD88C'
          gpg --batch --list-secret-keys "$fingerprint" >/dev/null
          python scripts/build_ios_apt_repo.py \
            --artifacts build/apt-artifacts \
            --dependencies build/apt-artifacts/dependencies.json \
            --output build/website/ios-apt \
            --gpg-home "$GNUPGHOME" \
            --key "$fingerprint"

      - name: Verify signed iOS software source
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("build/website/ios-apt/repository.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["sync_schedule"] = "Every 6 hours, with manual refresh available"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          python scripts/check_ios_apt_repo.py build/website/ios-apt
          test -f build/website/index.html
          test -f build/website/ios-apt/InRelease

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/website
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website and signed iOS source
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

